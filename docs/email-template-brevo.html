<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>{{ params.subject }}</title>
<link href="https://fonts.googleapis.com/css2?family=Anek+Tamil:wght@400;600;800&display=swap" rel="stylesheet">
<style>@import url('https://fonts.googleapis.com/css2?family=Anek+Tamil:wght@400;600;800&display=swap');</style>
</head>
<body style="margin:0;padding:0;background-color:#f1f5f9;font-family:'Times New Roman',Times,Georgia,serif;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;mso-hide:all;">{{ params.preheader }}&#8199;&#847;&#8199;&#847;&#8199;&#847;</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f1f5f9" style="background-color:#f1f5f9;">
  <tr>
    <td align="center" style="padding:24px 12px;">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;background-color:#ffffff;border-radius:20px;overflow:hidden;box-shadow:0 8px 30px rgba(15,23,42,0.08);">
        <tr>
          <td bgcolor="#7c3aed" style="padding:26px 28px;background-color:#7c3aed;background-image:linear-gradient(135deg,#ff2fd0 0%,#8a1dff 52%,#1f6bff 100%);">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td width="46" height="46" align="center" valign="middle" bgcolor="#12053a" style="width:46px;height:46px;border-radius:13px;background-color:#12053a;font-family:'Anek Tamil','Arial Black',Arial,Helvetica,sans-serif;font-size:19px;font-weight:800;color:#ffffff;letter-spacing:0.5px;">MJ</td>
                <td style="padding-left:14px;">
                  <div style="font-family:'Anek Tamil','Arial Black',Arial,Helvetica,sans-serif;font-size:12px;font-weight:700;letter-spacing:1.6px;color:rgba(255,255,255,0.85);text-transform:uppercase;">Your assistant</div>
                  <div style="font-family:'Times New Roman',Times,Georgia,serif;font-size:23px;line-height:1.25;font-weight:700;color:#ffffff;">{{ params.heading }}</div>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="padding:28px 28px 8px 28px;">
            <p style="margin:0 0 16px 0;font-family:'Times New Roman',Times,Georgia,serif;font-size:21px;font-weight:700;color:#0f172a;">Good day, Sir.</p>
            {{ params.body }}
            
          </td>
        </tr>
        <tr>
          <td style="padding:0 28px;"><div style="height:1px;background-color:#e2e8f0;line-height:1px;font-size:1px;">&nbsp;</div></td>
        </tr>
        <tr>
          <td style="padding:16px 28px 26px 28px;">
            <div style="font-family:'Anek Tamil','Arial Black',Arial,Helvetica,sans-serif;font-size:13px;line-height:1.5;color:#64748b;">Sent by <strong style="color:#6d28d9;">MJ</strong>, your personal intelligence assistant.</div>
            <div style="font-family:'Anek Tamil','Arial Black',Arial,Helvetica,sans-serif;font-size:12px;color:#94a3b8;margin-top:2px;">{{ params.date }}</div>
            <div style="font-family:'Times New Roman',Times,Georgia,serif;font-style:italic;font-size:13px;line-height:1.5;color:#94a3b8;margin-top:6px;">You are receiving this because you asked MJ to email you. Reply to chat with MJ on Telegram.</div>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
